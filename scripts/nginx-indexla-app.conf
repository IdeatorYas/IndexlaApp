# INDEXLA App nginx site — app.indexla.tech → PM2 indexla-app :3001

server {
    listen 80;
    server_name app.indexla.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.indexla.tech;

    ssl_certificate /etc/letsencrypt/live/app.indexla.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.indexla.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-App-Deploy-Commit unknown always;
    add_header X-Preview-Mode illustrative always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, must-revalidate" always;
    }
}
